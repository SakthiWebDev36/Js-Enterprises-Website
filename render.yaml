services:
  - type: web
    name: js-enterprises-api
    runtime: node
    region: singapore  # Closest to Chennai
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: DISPATCH_EMAIL
        sync: false
      - key: CLIENT_URL
        sync: false  # Set to your Vercel frontend URL
